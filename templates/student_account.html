<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – LeafTutor</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md bg-white p-8 shadow rounded-lg">
    <h2 class="text-center text-2xl font-bold mb-4">Create Your LeafTutor Account</h2>
    <form id="accountForm" class="space-y-4">
      <input type="hidden" id="token" value="{{ token }}" />

      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input id="username" name="username" type="text" required
               class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
      </div>

      <div>
        <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
        <input id="first_name" name="first_name" type="text" value="{{ first_name }}" required
               class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
      </div>

      <div>
        <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
        <input id="last_name" name="last_name" type="text" value="{{ last_name }}" required
               class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" readonly
               class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input id="password" name="password" type="password" required
               class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
      </div>

      <div>
        <label for="confirm" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input id="confirm" name="confirm" type="password" required
               class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
      </div>

      <p id="error" class="text-red-500 text-sm text-center"></p>

      <button type="submit"
              class="w-full py-2 px-4 bg-blue-600 text-white rounded hover:bg-blue-700">
        Create Account
      </button>
    </form>
  </div>
</div>

<script>
document.getElementById("accountForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = document.getElementById("token").value;
  const username = document.getElementById("username").value.trim();
  const first_name = document.getElementById("first_name").value.trim();
  const last_name = document.getElementById("last_name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const err = document.getElementById("error");

  err.textContent = "";

  if (password !== confirm) {
    err.textContent = "Passwords do not match.";
    return;
  }
  if (password.length < 8) {
    err.textContent = "Password must be at least 8 characters.";
    return;
  }

  try {
    const res = await fetch("/api/students/finish_registration", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, username, first_name, last_name, email, password })
    });
    const result = await res.json();
    if (result.status === "success") {
      alert("Account created! Please log in.");
      window.location.href = "/";  // redirect to login.html
    } else {
      err.textContent = result.error || "Account creation failed.";
    }
  } catch (e) {
    err.textContent = "An error occurred. Please try again.";
  }
});
</script>

</body>
</html>
